name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  test:
    name: Smoke / Contract / Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout api-testing-java
        uses: actions/checkout@v7

      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/movie-catalog-api
          path: movie-catalog-api

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Start movie-catalog-api
        run: docker compose up -d --build
        working-directory: movie-catalog-api
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for API to be ready
        working-directory: movie-catalog-api
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
              echo "API is ready after $((i * 5))s"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 5s..."
            sleep 5
          done
          echo "API did not become ready in time"
          docker compose logs --tail=100
          exit 1

      - name: Smoke tests
        run: mvn test -Dgroups=smoke
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Contract tests
        run: mvn test -Dgroups=contract
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Integration tests
        run: mvn test -Dgroups=integration
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Generate Allure report
        if: always()
        run: mvn allure:report -q

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 30

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout api-testing-java
        uses: actions/checkout@v7

      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/movie-catalog-api
          path: movie-catalog-api

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Start movie-catalog-api
        run: docker compose up -d --build
        working-directory: movie-catalog-api
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for API to be ready
        working-directory: movie-catalog-api
        run: |
          echo "Waiting for API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v3/api-docs > /dev/null; then
              echo "API is ready after $((i * 5))s"
              exit 0
            fi
            echo "Attempt $i/30 — retrying in 5s..."
            sleep 5
          done
          echo "API did not become ready in time"
          docker compose logs --tail=100
          exit 1

      - name: Regression tests
        run: mvn test -Dgroups=regression
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Generate Allure report
        if: always()
        run: mvn allure:report -q

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: target/site/allure-maven-plugin
          retention-days: 14